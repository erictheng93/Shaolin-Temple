[package]
name = "temple-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
default-run = "temple-server"

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.29"

rand = "0.9"
# 負載測試工具（src/bin/loadtest.rs）使用；已是 axum／tokio-tungstenite 的間接依賴。
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# 登入（src/auth.rs）：向 Google／LINE 的 token endpoint 換權杖（HTTPS，rustls；不需要 json／cookies 等功能）。
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form"] }
# session 權杖與登入流程 cookie 的 HMAC-SHA256 簽章，以及 PKCE 的 S256。
# 選 hmac 0.12／sha2 0.10：與已在 Cargo.lock 的 sha1 0.10（tungstenite）共用 digest 0.10，不多一份。
hmac = "0.12.1"
sha2 = "0.10.9"
# /metrics 權杖的常數時間比對（src/metrics.rs）；2.6 已是 hmac／digest 的間接依賴，不多一份。
subtle = "2.6.1"
# url-safe base64；0.22 已是 tungstenite 的間接依賴。
base64 = "0.22.1"
# 物理引擎（src/vehicles）：與前端 @dimforge/rapier3d-compat 0.21.0 同一版核心（該 npm 版本由 rapier 0.36.0 的提交發布），
# 所以鎖精確版本；升級時前後端一起升。預設功能（dim3、f32、std）即可。
rapier3d = "=0.36.0"

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util"] }
