# 前端靜態檔伺服器設定（nginx-unprivileged，監聽 8080；TLS 由前面的 Traefik 終結）。

# 快取規則依路徑決定（見 docs/DEPLOY.md「快取策略」）。$uri 是 try_files 回退後的路徑，SPA 回退即為 /index.html。
# 所有 add_header 都寫在 server 層：nginx（1.28）只要 location 裡有任何 add_header，就不再繼承外層的，
# 安全標頭會在那些 location 消失。
map $uri $cache_control {
    ~^/assets/                          "public, max-age=31536000, immutable";
    # 網址帶版本參數（?v=<指紋> 或 ?v=<STATUE_ASSET_VERSION>），改檔必改網址：永久快取。
    ~^/(lightmaps|statues)/             "public, max-age=31536000, immutable";
    # 網址沒有版本參數，檔案若被替換使用者會看到舊版，所以只快取 1 天（之後以 ETag 重新驗證）。
    ~^/(textures|models|basis|draco)/   "public, max-age=86400";
    # index.html 與其他根目錄檔案：每次重新驗證，新版部署後使用者立即拿到新的雜湊檔名。
    default                             "no-cache";
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        image/ktx2 ktx2;
        model/gltf-binary glb;
    }

    # 文字與 wasm 壓縮收益大；.ktx2（Basis 超壓縮）不列入，再壓幾乎沒有收益。
    # glb 以副檔名整批列入（monk.glb 未用 Draco，有收益；神像的 Draco glb 收益小，CPU 成本可忽略）。nginx 內建只有 gzip，沒有 brotli。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm model/gltf-binary;

    add_header Cache-Control $cache_control;
    # 安全標頭（規則與 web/public/_headers 相同）：不允許被別的網站嵌入框架、不猜 MIME、
    # 跨站只送來源、關閉用不到的裝置權限。
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /assets/ {
        try_files $uri =404;
    }

    location ~ ^/(lightmaps|statues|textures|models|basis|draco)/ {
        try_files $uri =404;
    }

    # 找不到的路徑回退 index.html（SPA）。
    location / {
        try_files $uri /index.html;
    }
}
