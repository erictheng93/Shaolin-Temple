# 前端靜態檔伺服器設定（nginx-unprivileged，監聽 8080；TLS 由前面的 Traefik 終結）。
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        image/ktx2 ktx2;
        model/gltf-binary glb;
    }

    # 文字與 wasm 壓縮收益大；.ktx2（Basis 超壓縮）不列入，再壓幾乎沒有收益。
    # glb 以副檔名整批列入（monk.glb 未用 Draco，有收益；神像的 Draco glb 收益小，CPU 成本可忽略）。nginx 內建只有 gzip，沒有 brotli。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm model/gltf-binary;

    # Vite 輸出的檔名帶內容雜湊，內容變了網址就變：永久快取。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 網址帶版本參數（?v=<指紋> 或 ?v=<STATUE_ASSET_VERSION>），改檔必改網址：永久快取。
    location ~ ^/(lightmaps|statues)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 網址沒有版本參數，檔案若被替換使用者會看到舊版，所以只快取 1 天（之後以 ETag 重新驗證）。
    location ~ ^/(textures|models|basis|draco)/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # index.html 與其他根目錄檔案：每次重新驗證，新版部署後使用者立即拿到新的雜湊檔名。
    # 找不到的路徑回退 index.html（SPA）。
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
